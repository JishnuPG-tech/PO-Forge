services:
  - type: web
    name: poforge-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGIN
        value: https://po-forge.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: poforge-postgres
          property: connectionString

databases:
  - name: poforge-postgres
    plan: free
    region: oregon
    databaseName: poforge
    user: poforge_admin
