name: Build Hermes Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter via Git
        run: |
          git clone --depth 1 -b 3.24.5 https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd Mobile/conduit
          flutter pub get

      - name: Build Release APK
        run: |
          cd Mobile/conduit
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-release-apk
          path: Mobile/conduit/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
