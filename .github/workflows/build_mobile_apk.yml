name: Build Hermes Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter via Git
        run: |
          git clone --depth 1 -b 3.24.5 https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd Mobile/conduit
          flutter pub get

      - name: Build Release APK
        run: |
          cd Mobile/conduit
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-release-apk
          path: Mobile/conduit/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish Direct Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp Mobile/conduit/build/app/outputs/flutter-apk/app-release.apk ./Hermes-Coach-v1.0.0.apk
          # Check if release exists, if so upload to it, otherwise create it
          if gh release view v1.0.0-hermes > /dev/null 2>&1; then
            gh release upload v1.0.0-hermes ./Hermes-Coach-v1.0.0.apk --clobber
          else
            gh release create v1.0.0-hermes ./Hermes-Coach-v1.0.0.apk --title "Hermes AI Banking Coach v1.0.0" --notes "Official Hermes AI Coach Android release with pitch black theme, anime branding, and instant native Hermes chat."
          fi
